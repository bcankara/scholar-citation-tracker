name: release

# Tag push (v*): test, build, and create a DRAFT GitHub release with the NSIS installer, its
# .sig, latest.json (updater feed), SHA256SUMS.txt and a build provenance attestation.
# Manual run (workflow_dispatch): same build, but no release is created; the installer is only
# kept as a workflow artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The app has no package.json. The Tauri CLI is installed from npm on the runner only and
      # handed to tauri-action through `tauriScript`.
      - name: Install Tauri CLI
        shell: pwsh
        run: npm install --global "@tauri-apps/cli@2"

      - name: Check that the tag matches the app version
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match tauri.conf.json version v$version"
            exit 1
          }

      # Tests that need the (git-ignored) local profile fixture skip themselves on CI.
      - name: cargo test
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and (for tags) draft the release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: tauri
          projectPath: .
          # An empty tagName makes the action build only (manual runs).
          tagName: ${{ env.IS_RELEASE == 'true' && github.ref_name || '' }}
          releaseName: ${{ env.IS_RELEASE == 'true' && 'v__VERSION__' || '' }}
          releaseBody: "See the assets below. The installer is not code-signed; see the README (Installing) for the SmartScreen notice and how to verify the download."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: ${{ env.IS_RELEASE != 'true' }}

      - name: SHA256SUMS.txt
        id: sums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "NSIS installer not found"; exit 1 }
          # The file name as GitHub stores it (spaces become dots), so the sums match the download.
          $name = $exe.Name
          if ($env:RELEASE_ID) {
            $assets = gh api "repos/${{ github.repository }}/releases/$env:RELEASE_ID" --jq '.assets[].name'
            $match = $assets | Where-Object { $_ -like "*setup.exe" } | Select-Object -First 1
            if ($match) { $name = $match }
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          "installer=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload SHA256SUMS.txt to the draft release
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          # Drafts have no tag yet, so upload by release id through the API.
          gh api --method POST "https://uploads.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=SHA256SUMS.txt" `
            -H "Content-Type: text/plain" --input SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Keep SHA256SUMS.txt for manual runs
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt
