[package]
name = "scholar-citation-tracker"
version = "1.6.1"
description = "Google Scholar citation tracker (Windows and macOS desktop app)"
license = "MIT"
edition = "2021"

[lib]
name = "scholar_citation_tracker_lib"
crate-type = ["rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
flate2 = "1"
# The platform credential store is selected per target further down
# (Windows Credential Manager / macOS Keychain).
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "cookies"] }
rust_xlsxwriter = "0.103"
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
# No "macos-private-api" feature: since Tauri 2.12.1 the feature and the matching macOSPrivateApi
# config flag are no-ops (wry always clears the WKWebView background of a transparent window), and
# tauri-build rejects a feature set that differs from the merged config of the platform being built,
# so listing it here would break a plain `cargo build` on Windows.
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["time", "sync", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Objective-C bridge for the one thing Tauri does not wrap: printing the report
# window's WKWebView to a PDF file. The versions match the ones tao/wry already
# build, so nothing is compiled twice.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSGeometry"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time", "sync", "rt", "macros", "test-util"] }
