[package]
name = "scholar-citation-tracker"
version = "1.2.0"
description = "Google Scholar citation tracker (Windows desktop app)"
license = "MIT"
edition = "2021"

[lib]
name = "scholar_citation_tracker_lib"
crate-type = ["rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "cookies"] }
rust_xlsxwriter = "0.103"
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["time", "sync", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time", "sync", "rt", "macros", "test-util"] }
